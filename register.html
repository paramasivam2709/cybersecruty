<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white flex items-center justify-center min-h-screen">

<div class="p-8 rounded-xl border border-gray-700 w-96 text-center">

<h2 class="text-2xl mb-4">Create Account</h2>

<input type="text" id="name" placeholder="Name"
class="w-full p-3 mb-3 bg-black border border-gray-600 rounded">

<input type="email" id="email" placeholder="Email"
class="w-full p-3 mb-3 bg-black border border-gray-600 rounded">

<input type="password" id="password" placeholder="Password"
class="w-full p-3 mb-3 bg-black border border-gray-600 rounded">

<p id="msg" class="text-red-500 text-sm mb-3 hidden">Fill all fields</p>

<button onclick="registerUser()" 
class="w-full py-3 bg-green-500 text-black rounded-full">
Register
</button>

<a href="login.html" class="block mt-4 text-green-400">
Already have account? Login
</a>

</div>

<script>
function registerUser() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let msg = document.getElementById("msg");

    if (!name || !email || !password) {
        msg.classList.remove("hidden");
        return;
    }

    msg.classList.add("hidden");

    alert("Registered Successfully ✅");

    // redirect only (no storage)
    window.location.href = "login.html";
}
</script>

</body>
</html>
