<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Stackly</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: #050505;
    color: white;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<!-- Back Button -->
<button onclick="goBack()" 
class="absolute top-6 left-6 px-4 py-2 border border-gray-600 rounded-full hover:border-green-500">
    ← Back
</button>

<div class="w-full max-w-md p-8 rounded-2xl border border-gray-700 bg-black/40 backdrop-blur">

    <h2 class="text-3xl font-bold text-center mb-6">Login</h2>

    <!-- Role -->
    <select id="role" class="w-full p-3 mb-4 bg-black border border-gray-600 rounded-lg">
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="user">User</option>
    </select>

    <!-- Email -->
    <input type="email" id="email" placeholder="Email"
        class="w-full p-3 mb-4 bg-black border border-gray-600 rounded-lg">

    <!-- Password -->
    <div class="relative">
        <input type="password" id="password" placeholder="Password"
            class="w-full p-3 mb-4 bg-black border border-gray-600 rounded-lg">
        
        <span onclick="togglePassword()" 
        class="absolute right-3 top-3 cursor-pointer">👁</span>
    </div>

    <!-- Error -->
    <p id="error" class="text-red-500 text-sm mb-3 hidden">Please fill all fields</p>

    <!-- Login -->
    <button onclick="login()"
        class="w-full py-3 bg-green-500 text-black font-bold rounded-full hover:bg-green-400 mb-4">
        Login
    </button>

    <!-- Extra Buttons -->
    <div class="flex justify-between text-sm text-gray-400">
        <a href="forgot.html" class="hover:text-green-400">Forgot Password?</a>
        <a href="register.html" class="hover:text-green-400">Create Account</a>
    </div>

</div>

<script>
function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

function goBack() {
    window.history.back();
}

function login() {
    let role = document.getElementById("role").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let error = document.getElementById("error");

    if (!role || !email || !password) {
        error.classList.remove("hidden");
        return;
    }

    error.classList.add("hidden");

    if (role === "admin") {
        window.location.href = "admin.html";
    } else {
        window.location.href = "user.html";
    }
}
</script>

</body>
</html>
