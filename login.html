<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackly Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050505;
overflow-x:hidden;
overflow-y:auto;
padding:24px 16px;
}

body::before{
content:'';
position:absolute;
width:500px;
height:500px;
background:#22c55e;
filter:blur(180px);
opacity:.15;
border-radius:50%;
}

.login-card{
width:420px;
max-width:100%;
background:#0d0d0d;
border:1px solid rgba(34,197,94,.2);
border-radius:24px;
padding:40px;
backdrop-filter:blur(20px);
box-shadow:0 0 30px rgba(34,197,94,.1);
position:relative;
z-index:10;
}

.logo{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-bottom:30px;
}

.logo img{
width:45px;
height:45px;
}

.logo h2{
font-size:30px;
font-weight:800;
color:#fff;
}

.logo span{
color:#22c55e;
}

h3{
text-align:center;
margin-bottom:25px;
font-size:28px;
color:white;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:8px;
color:#bbb;
font-size:14px;
}

.input-group input,
.input-group select{
width:100%;
padding:14px;
background:#141414;
border:1px solid #222;
border-radius:12px;
color:white;
font-size:15px;
}

.input-group input:focus,
.input-group select:focus{
outline:none;
border-color:#22c55e;
}

.password-box{
position:relative;
}

.password-box button{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
color:#22c55e;
cursor:pointer;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:16px;
margin-bottom:20px;
font-size:14px;
}

.row label{
display:flex;
align-items:center;
gap:8px;
color:#bbb;
white-space:nowrap;
}

.row input[type="checkbox"]{
accent-color:#22c55e;
}

.row a{
color:#22c55e;
text-decoration:none;
white-space:nowrap;
}

@media (max-width:480px){
.login-card{
padding:28px 20px;
}

.row{
align-items:flex-start;
flex-direction:column;
}
}

@media (max-height:760px){
body{
align-items:flex-start;
}
}

.login-btn{
width:100%;
padding:15px;
border:none;
border-radius:50px;
background:#22c55e;
color:black;
font-weight:700;
font-size:16px;
cursor:pointer;
transition:.3s;
}

.login-btn:hover{
transform:translateY(-2px);
background:#2ee66b;
}

.back-btn{
display:block;
text-align:center;
margin-top:15px;
color:#22c55e;
text-decoration:none;
}

.footer{
margin-top:25px;
text-align:center;
color:#666;
font-size:13px;
}
</style>
</head>
<body>

<div class="login-card">

<div class="logo">
<img src="img/logo-green.webp" alt="logo">
<h2>Stackly<span>.</span></h2>
</div>

<h3>Welcome Back</h3>

<form onsubmit="login(event)">

<div class="input-group">
<label>Email</label>
<input type="email" id="email" placeholder="Enter email" required>
</div>

<div class="input-group">
<label>Password</label>

<div class="password-box">
<input type="password" id="password" placeholder="Enter password" required>
<button type="button" onclick="togglePassword()">Show</button>
</div>

</div>

<div class="input-group">
<label>Select Role</label>
<select id="role">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
</div>

<div class="row">
<label>
<input type="checkbox">
 Remember Me
</label>

<a href="forgot.html">Forgot Password?</a>
</div>

<button class="login-btn">
Login →
</button>
<div style="text-align:center;margin-top:20px;color:#888;">
    Don't have an account?
    <a href="register.html" style="color:#22c55e;text-decoration:none;font-weight:600;">
        Sign Up
    </a>
</div>

</form>

<a href="index.html" class="back-btn">← Back to Home</a>

<div class="footer">
Protected by Stackly Security
</div>

</div>

<script>

function togglePassword(){
let pass=document.getElementById("password");

if(pass.type==="password"){
pass.type="text";
}else{
pass.type="password";
}
}

function login(e){

e.preventDefault();

let email=document.getElementById("email").value;
let role=document.getElementById("role").value;

if(role==="admin"){
window.location.href=
"admin.html?email="+encodeURIComponent(email);
}
else{
window.location.href=
"user.html?email="+encodeURIComponent(email);
}
}

</script>

</body>
</html>
