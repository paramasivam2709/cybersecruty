<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Stackly</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050505;
overflow:hidden;
}

body::before{
content:'';
position:absolute;
width:500px;
height:500px;
background:#22c55e;
filter:blur(180px);
opacity:.15;
border-radius:50%;
}

.card{
width:420px;
background:#0d0d0d;
padding:40px;
border-radius:24px;
border:1px solid rgba(34,197,94,.2);
box-shadow:0 0 30px rgba(34,197,94,.1);
position:relative;
z-index:10;
}

.logo{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-bottom:25px;
}

.logo img{
width:45px;
height:45px;
}

.logo h2{
color:#fff;
font-weight:800;
}

.logo span{
color:#22c55e;
}

h3{
text-align:center;
color:#fff;
margin-bottom:10px;
}

.desc{
text-align:center;
color:#888;
font-size:14px;
margin-bottom:25px;
line-height:1.5;
}

input{
width:100%;
padding:14px;
background:#141414;
border:1px solid #222;
border-radius:12px;
color:#fff;
margin-bottom:18px;
}

input:focus{
outline:none;
border-color:#22c55e;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:50px;
background:#22c55e;
color:#000;
font-weight:700;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#2ee66b;
}

.success{
display:none;
margin-top:15px;
padding:12px;
background:#0f2918;
border:1px solid #22c55e;
border-radius:10px;
color:#22c55e;
text-align:center;
font-size:14px;
}

.links{
margin-top:20px;
text-align:center;
}

.links a{
color:#22c55e;
text-decoration:none;
font-weight:600;
margin:0 10px;
}
</style>
</head>
<body>

<div class="card">

<div class="logo">
<img src="img/logo-green.webp" alt="Logo">
<h2>Stackly<span>.</span></h2>
</div>

<h3>Forgot Password?</h3>

<p class="desc">
Enter your registered email address and we'll send you password reset instructions.
</p>

<form onsubmit="resetPassword(event)">
<input type="email" id="email" placeholder="Enter your email address" required>

<button type="submit">
Send Reset Link
</button>
</form>

<div class="success" id="successMsg">
Password reset link sent successfully!
</div>

<div class="links">
<a href="login.html">← Back to Login</a>
</div>

</div>

<script>
function resetPassword(e){
e.preventDefault();

document.getElementById("successMsg").style.display="block";

setTimeout(()=>{
window.location.href="login.html";
},2000);
}
</script>

</body>
</html>
